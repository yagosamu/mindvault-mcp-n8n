[project]
name = "mindvault-mcp"
version = "0.1.0"
description = "MCP server exposing a PARA knowledge vault over semantic search"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to a real Qdrant/OpenAI; deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
